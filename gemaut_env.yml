name: gemaut_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Pins ciblés (séries validées sur l'env de référence)
  - python=3.14.*
  - numpy=2.5.*
  - scipy=1.18.*
  - rasterio=1.5.*
  - gdal=3.12.*
  - libgdal=3.12.*
  - pdal=2.10.*
  - python-pdal=3.5.*
  - wxwidgets=3.3.*
  - tqdm
  - loguru
  - cmake
  - make
  - cxx-compiler
  - git
  - proj
  - geos
  - sqlite
  - hdf5
  - eigen
  - suitesparse
  - tbb-devel
  - pkg-config
  # OpenCV 5 supprime l'API C legacy ; 
  - libopencv>=4.5,<5
  - opencv>=4.5,<5
  - py-opencv>=4.5,<5
  - gsl
  - pip
